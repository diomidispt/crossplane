apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: xsecuritygroups.demo.crossplane.io
  labels:
    provider: aws
spec:
  compositeTypeRef:
    apiVersion: demo.crossplane.io/v1alpha1
    kind: XSecurityGroup
  mode: Pipeline
  pipeline:
    - step: patch-and-transform
      functionRef:
        name: function-patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        patchSets:
          - name: region
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.region
                toFieldPath: spec.forProvider.region
        resources:
          - name: security-group
            base:
              apiVersion: ec2.aws.upbound.io/v1beta1
              kind: SecurityGroup
              spec:
                forProvider:
                  region: eu-central-1
                  description: Managed by Crossplane
                providerConfigRef:
                  name: default
            patches:
              - type: PatchSet
                patchSetName: region
              - type: FromCompositeFieldPath
                fromFieldPath: spec.vpcId
                toFieldPath: spec.forProvider.vpcId
              - type: FromCompositeFieldPath
                fromFieldPath: spec.description
                toFieldPath: spec.forProvider.description
              # Surface the real SG ID back so VirtualMachine claims can reference it
              - type: ToCompositeFieldPath
                fromFieldPath: status.atProvider.id
                toFieldPath: status.securityGroupId

          - name: ssh-ingress-rule
            base:
              apiVersion: ec2.aws.upbound.io/v1beta1
              kind: SecurityGroupIngressRule
              spec:
                forProvider:
                  region: eu-central-1
                  ipProtocol: tcp
                  fromPort: 22
                  toPort: 22
                  # Targets the SecurityGroup created in this same composition
                  securityGroupIdSelector:
                    matchControllerRef: true
                providerConfigRef:
                  name: default
            patches:
              - type: PatchSet
                patchSetName: region
              - type: FromCompositeFieldPath
                fromFieldPath: spec.allowSshCidr
                toFieldPath: spec.forProvider.cidrIpv4
