apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: xsecuritygroups.demo.crossplane.io
spec:
  group: demo.crossplane.io
  names:
    kind: XSecurityGroup
    plural: xsecuritygroups
  claimNames:
    kind: SecurityGroup
    plural: securitygroups
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - vpcId
              properties:
                region:
                  type: string
                  default: eu-central-1
                vpcId:
                  type: string
                  description: VPC ID in which to create this security group.
                description:
                  type: string
                  default: Managed by Crossplane
                allowSshCidr:
                  type: string
                  default: "0.0.0.0/0"
                  description: CIDR allowed for SSH (port 22) ingress. Restrict this in production.
            status:
              type: object
              properties:
                securityGroupId:
                  type: string
                  description: AWS Security Group ID — use this in VirtualMachine claims.
